<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上交所股票期权 · 模拟刷题</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--surface:#f8f9fc;--ink:#22283a;--ink2:#606a7f;--muted:#9aa3b5;--line:#e3e7ef;--brand:#5148d9;--brand2:#eeedff;--ok:#16815f;--okbg:#e9f7f0;--bad:#b86819;--badbg:#fff4e6;--shadow:0 8px 28px rgba(34,40,58,.07),0 2px 7px rgba(34,40,58,.035)}
body[data-theme="dark"]{--bg:#171922;--card:#222531;--surface:#292d39;--ink:#f0f2f6;--ink2:#b9c0ce;--muted:#838c9e;--line:#383e4d;--brand:#9c98ff;--brand2:#34335b;--ok:#6dd5ae;--okbg:#203c36;--bad:#f1bb79;--badbg:#463523;--shadow:0 12px 30px rgba(0,0,0,.2)}
body[data-theme="sepia"]{--bg:#f3eee3;--card:#fffdf7;--surface:#faf6ec;--ink:#3d352b;--ink2:#756757;--muted:#a69784;--line:#e5dccb;--brand:#80653c;--brand2:#f0e6d4;--ok:#4f8066;--okbg:#e8f2ea;--bad:#a66d2f;--badbg:#faeedb}
.zen .nav-card,.zen .date,.zen .brand small{display:none}.zen .hero{max-width:780px;margin-left:auto;margin-right:auto}.zen header{justify-content:flex-end}.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:9px;padding:7px 9px;cursor:pointer}.theme-btn:hover{color:var(--brand);border-color:var(--brand)}.settings-panel{position:fixed;right:18px;top:66px;z-index:8;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;padding:14px;width:220px;display:none}.settings-panel.on{display:block}.settings-panel h3{margin:0 0 10px;font-size:15px}.settings-panel label{display:flex;align-items:center;justify-content:space-between;padding:8px 0;color:var(--ink2);font-size:13px}.settings-panel select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);background-image:radial-gradient(circle at 10% 0%,#e6ebff 0,transparent 45%),radial-gradient(circle at 95% 5%,#e3f6f4 0,transparent 40%);color:var(--ink);min-height:100vh;padding:22px 16px 54px}.app{max-width:820px;margin:auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.brand{font-size:22px;font-weight:750;letter-spacing:.2px}.brand small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}.date{font-size:13px;color:var(--ink2)}
.hero{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:9px}.hero-top b{color:var(--ink);font-size:15px}.track{height:8px;background:#edf0f6;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#6366f1,#4f46e5);border-radius:99px;transition:width .35s}
.question-card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:28px 28px 24px;margin-bottom:14px}.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-bottom:18px}.q-no{color:var(--brand);background:var(--brand2);border-radius:99px;padding:5px 11px;font-weight:700}.q-text{font-size:21px;line-height:1.75;font-weight:650;letter-spacing:.1px;white-space:pre-wrap}.options{display:grid;gap:10px;margin-top:24px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px 15px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;transition:.16s;line-height:1.55}.option:hover{border-color:#bbbfff;background:#fafaff}.option .letter{width:25px;height:25px;border:1px solid #cfd5e2;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--ink2);font-weight:700;font-size:13px}.option .txt{flex:1;min-width:0}.option.selected{border-color:var(--brand);background:var(--brand2)}.option.selected .letter{background:var(--brand);border-color:var(--brand);color:#fff}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}.option.wrong{border-color:var(--bad);background:var(--badbg)}.option.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}.option:disabled{cursor:default}
.feedback{display:none;margin-top:18px;border-radius:13px;padding:14px 16px;line-height:1.65;font-size:14px}.feedback.on{display:block}.feedback.ok{background:var(--okbg);color:#087652}.feedback.bad{background:var(--badbg);color:#a35900}.feedback strong{font-size:16px}.feedback .explain{margin-top:5px;color:var(--ink2)}
.actions{display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:13px 17px;font:700 14px inherit;cursor:pointer;transition:.16s}.btn:active{transform:scale(.98)}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 7px 18px rgba(79,70,229,.25)}.btn.primary:hover{background:#4338ca}.btn.ghost{background:#fff;color:var(--ink2);box-shadow:var(--shadow)}.btn.ghost:hover{color:var(--brand)}.btn:disabled{opacity:.45;cursor:not-allowed}.next{flex:1}.shortcut{font-size:11px;color:var(--muted);margin-top:12px;text-align:center}
.nav-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}.nav-title{font-size:13px;color:var(--ink2);margin-bottom:9px;display:flex;justify-content:space-between}.jump-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto}.jump{width:34px;height:30px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;font-size:12px;cursor:pointer}.jump:hover{border-color:#b8bbff;color:var(--brand)}.jump.current{background:var(--brand);border-color:var(--brand);color:#fff}.jump.done{background:var(--okbg);border-color:#c4ecd9;color:var(--ok)}.jump.wrong{background:var(--badbg);border-color:#f1d4ad;color:var(--bad)}
.panel{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:38px 26px;text-align:center}.panel .big{font-size:48px;line-height:1;margin-bottom:15px}.panel h2{margin:0 0 8px;font-size:23px}.panel p{color:var(--ink2);font-size:14px;line-height:1.7;margin:0}.stats{display:flex;gap:10px;margin:24px 0;text-align:left}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex:1;color:var(--ink2);font-size:12px}.stat b{display:block;color:var(--ink);font-size:22px;margin-bottom:2px}.panel .actions{margin-top:20px}.review-title{text-align:left;margin:22px 0 8px;font-size:14px;font-weight:700}.review{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;background:#f8fafc;margin-top:6px;font-size:13px}.review b{width:90px}.review span{color:var(--ink2);flex:1}.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,18px);background:#1c2333;color:#fff;padding:10px 17px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){body{padding:16px 11px 40px}.question-card{padding:22px 16px 18px}.q-text{font-size:18px;line-height:1.65}.option{padding:12px}.brand small{display:none}.actions{gap:7px}.btn{padding:12px 11px;font-size:13px}.jump-grid{max-height:118px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">📝 上交所股票期权 <small>模拟刷题</small></div><div style="display:flex;align-items:center;gap:7px"><div class="date" id="date"></div><button class="theme-btn" id="zenBtn" title="沉浸模式">◐</button><button class="theme-btn" id="themeBtn" title="切换主题">☾</button><button class="theme-btn" id="settingsBtn" title="设置">⚙</button></div></header>
<div class="hero"><div class="hero-top"><span id="modeLabel">单选题 · 共 205 题</span><span id="statusRight"><span id="timer">00:00</span> · <b id="progressNow">1</b> / <span id="progressAll">205</span></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
<div class="settings-panel" id="settingsPanel"><h3>刷题设置</h3><label>计时器 <input type="checkbox" id="timerToggle" checked></label><label>主题 <select id="themeSelect"><option value="light">明亮</option><option value="sepia">护眼</option><option value="dark">深色</option></select></label><label>沉浸模式 <input type="checkbox" id="zenToggle"></label><button class="theme-btn" id="resetBtn" style="width:100%;margin-top:8px">清空进度并重来</button></div>
<main id="main"></main>
<div class="toast" id="toast"></div>
</div>
<script src="options-data.js"></script>
<script>
(function(){
'use strict';
var Q=window.OPTION_QUESTIONS||[];var KEY='option-quiz-v2';var LETTERS=['A','B','C','D'];
var S={answers:{},current:0,wrong:[],marked:[],theme:'light',zen:false,showTimer:true,startedAt:Date.now()};
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'})[c]})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){Object.keys(S).forEach(function(k){if(x[k]!==undefined)S[k]=x[k]})}}catch(e){}if(S.current>=Q.length)S.current=0;if(!Number.isFinite(S.startedAt))S.startedAt=Date.now()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyView(){document.body.dataset.theme=S.theme||'light';document.body.classList.toggle('zen',!!S.zen);$('themeSelect').value=S.theme||'light';$('zenToggle').checked=!!S.zen;document.getElementById('themeBtn').textContent=S.theme==='dark'?'☀':(S.theme==='sepia'?'◐':'☾')}
function tick(){var t=$('timer');if(!S.showTimer){t.style.display='none';return}t.style.display='inline';var s=Math.floor((Date.now()-S.startedAt)/1000);t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(tick,1000)
function toast(x){var t=$('toast');t.textContent=x;t.classList.add('on');clearTimeout(window.__toast);window.__toast=setTimeout(function(){t.classList.remove('on')},1600)}
function answered(id){return S.answers[id]||''}
function isWrong(id){return S.wrong.indexOf(id)>=0}
function renderHeader(){var d=new Date();var wk=['日','一','二','三','四','五','六'][d.getDay()];$('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk+' · 单选题';$('progressNow').textContent=Math.min(S.current+1,Q.length);$('progressAll').textContent=Q.length;$('fill').style.width=(Q.length?((S.current+1)/Q.length*100):0)+'%';applyView();tick()}
function render(){renderHeader();if(!Q.length){$('main').innerHTML='<div class="panel"><div class="big">⚠️</div><h2>题库加载失败</h2><p>请确认 options-data.js 文件存在。</p></div>';return}var q=Q[S.current];var chosen=answered(q.id);var locked=!!chosen;var correct=chosen===q.answer;var options=q.options.map(function(x,i){var l=LETTERS[i],cl='option';if(locked&&l===q.answer)cl+=' correct';if(locked&&l===chosen&&chosen!==q.answer)cl+=' wrong';if(!locked&&l===chosen)cl+=' selected';return '<button class="'+cl+'" data-answer="'+l+'" '+(locked?'disabled':'')+'><span class="letter">'+l+'</span><span class="txt">'+esc(x)+'</span></button>'}).join('');var fb=locked?'<div class="feedback on '+(correct?'ok':'bad')+'"><strong>'+(correct?'✓ 回答正确':'✗ 回答错误')+'</strong> · 正确答案：<b>'+q.answer+'</b><div class="explain">'+(correct?'继续保持，进入下一题。':'可以先记住这个考点，再看下一题。PDF 原题库提供答案，未提供逐题解析。')+'</div></div>':'';$('main').innerHTML='<section class="question-card"><div class="q-head"><span class="q-no">第 '+q.id+' 题</span><span>'+(locked?(correct?'已答对':'需复习'):'请选择一个答案')+'</span></div><div class="q-text">'+esc(q.question)+'</div><div class="options">'+options+'</div>'+fb+'<div class="actions" style="margin-top:18px"><button class="btn ghost" id="prev" '+(S.current===0?'disabled':'')+'>← 上一题</button><button class="btn primary next" id="next" '+(!locked?'disabled':'')+'>'+(S.current===Q.length-1?'查看成绩':'下一题 →')+'</button></div><div class="shortcut">快捷键：A/B/C/D 选择答案 · ←/→ 切题 · 空格下一题</div></section><section class="nav-card"><div class="nav-title"><span>题目导航</span><span>绿色=答对 · 橙色=错题</span></div><div class="jump-grid">'+Q.map(function(x,i){var a=answered(x.id);return '<button class="jump '+(i===S.current?'current ':'')+(a?(isWrong(x.id)?'wrong':'done'):'')+'" data-jump="'+i+'">'+x.id+'</button>'}).join('')+'</div></section>';
Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'),function(b){b.onclick=function(){if(answered(q.id))return;var a=b.dataset.answer;S.answers[q.id]=a;if(a!==q.answer&&!isWrong(q.id))S.wrong.push(q.id);if(a===q.answer)S.wrong=S.wrong.filter(function(x){return x!==q.id});save();render()}});$('prev').onclick=function(){if(S.current>0){S.current--;save();render();window.scrollTo({top:0,behavior:'smooth'})}};$('next').onclick=function(){if(!answered(q.id))return;if(S.current<Q.length-1){S.current++;save();render();window.scrollTo({top:0,behavior:'smooth'})}else renderResult()};Array.prototype.forEach.call(document.querySelectorAll('[data-jump]'),function(b){b.onclick=function(){S.current=Number(b.dataset.jump);save();render();window.scrollTo({top:0,behavior:'smooth'})}})}
function renderResult(){var total=Q.length,done=Object.keys(S.answers).length,correct=Q.filter(function(q){return S.answers[q.id]===q.answer}).length,wrong=Q.filter(function(q){return isWrong(q.id)});renderHeader();$('main').innerHTML='<div class="panel"><div class="big">'+(wrong.length?'💪':'🎉')+'</div><h2>刷题完成</h2><p>已完成 '+done+' / '+total+' 题，本轮正确 '+correct+' 题。</p><div class="stats"><div class="stat"><b>'+correct+'</b>答对</div><div class="stat"><b>'+wrong.length+'</b>错题</div><div class="stat"><b>'+Math.round(correct/total*100)+'%</b>正确率</div></div>'+(wrong.length?'<div class="review-title">错题概览</div>'+wrong.slice(0,12).map(function(id){var q=Q.filter(function(x){return x.id===id})[0];return '<div class="review"><b>第 '+id+' 题</b><span>'+esc(q.question.slice(0,36))+'…</span><em>答案 '+q.answer+'</em></div>'}).join(''):'')+'<div class="actions"><button class="btn ghost" id="reviewWrong" '+(wrong.length?'':'disabled')+'>🔁 只练错题</button><button class="btn primary next" id="restart">重新开始</button></div></div>';$('restart').onclick=function(){S.answers={};S.wrong=[];S.current=0;save();render()};var rw=$('reviewWrong');if(rw)rw.onclick=function(){var first=Q.findIndex(function(q){return isWrong(q.id)});S.current=first<0?0:first;save();render();toast('从错题开始复习')};}
document.addEventListener('keydown',function(e){if(e.target&&['INPUT','TEXTAREA'].indexOf(e.target.tagName)>=0)return;var q=Q[S.current];if(!q)return;var k=e.key.toUpperCase();if(LETTERS.indexOf(k)>=0&&!answered(q.id)){var b=document.querySelector('[data-answer="'+k+'"]');if(b)b.click()}else if(e.key==='ArrowLeft'&&S.current>0){S.current--;save();render()}else if(e.key==='ArrowRight'&&answered(q.id)&&S.current<Q.length-1){S.current++;save();render()}else if(e.code==='Space'&&answered(q.id)){e.preventDefault();if(S.current<Q.length-1){S.current++;save();render()}}});
load();
$('themeBtn').onclick=function(){S.theme=S.theme==='light'?'dark':(S.theme==='dark'?'sepia':'light');save();applyView();toast('已切换主题')};
$('zenBtn').onclick=function(){S.zen=!S.zen;save();applyView();toast(S.zen?'已进入沉浸模式':'已退出沉浸模式')};
$('settingsBtn').onclick=function(){$('settingsPanel').classList.toggle('on')};
$('themeSelect').onchange=function(){S.theme=this.value;save();applyView()};
$('zenToggle').onchange=function(){S.zen=this.checked;save();applyView()};
$('timerToggle').onchange=function(){S.showTimer=this.checked;save();tick()};
$('resetBtn').onclick=function(){if(confirm('确定清空全部答题进度并重新开始？')){S.answers={};S.current=0;S.wrong=[];S.marked=[];S.startedAt=Date.now();save();render();toast('已重置')}};
document.addEventListener('click',function(e){if(!e.target.closest('#settingsPanel')&&!e.target.closest('#settingsBtn'))$('settingsPanel').classList.remove('on')});
render();
})();
</script>
</body>
</html>

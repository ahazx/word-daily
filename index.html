<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日五词 · 自选词书背单词</title>
<style>
  :root{
    --bg:#eef1f7;
    --card:#ffffff;
    --ink:#1c2333;
    --ink-2:#5a6478;
    --ink-3:#98a1b3;
    --line:#e3e8f0;
    --brand:#4f46e5;
    --brand-soft:#eef0ff;
    --ok:#0ea472;
    --ok-soft:#e6f7f1;
    --warn:#d97706;
    --warn-soft:#fdf3e4;
    --shadow:0 10px 30px rgba(28,35,51,.08), 0 2px 8px rgba(28,35,51,.04);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    background-image:radial-gradient(circle at 12% 0%, #e6ebff 0%, transparent 45%),
                     radial-gradient(circle at 92% 6%, #e3f6f4 0%, transparent 40%);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    padding:22px 16px 60px;
  }
  .app{ max-width:720px; margin:0 auto; }

  /* ---------- header ---------- */
  header{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .brand{ font-size:21px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:8px; }
  .brand small{ font-size:12px; font-weight:500; color:var(--ink-3); letter-spacing:0; }
  .date{ font-size:13px; color:var(--ink-2); }
  .date b{ color:var(--brand); font-weight:600; }

  /* ---------- plan chips ---------- */
  .plan-bar{ display:flex; gap:8px; align-items:center; background:#fff; padding:8px; border-radius:14px; box-shadow:var(--shadow); margin-bottom:12px; }
  .chips{ display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip-b{ display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; background:var(--brand-soft); color:var(--brand);
    border:0; border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:600; font-family:inherit; cursor:pointer; transition:.16s; }
  .chip-b:hover{ background:#e2e6ff; }
  .chip-b .x{ opacity:.5; font-size:13px; }
  .chip-b:hover .x{ opacity:1; }
  .add-book{ flex:0 0 auto; border:0; background:var(--brand); color:#fff; border-radius:10px; padding:8px 13px;
    font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:.16s; white-space:nowrap; }
  .add-book:hover{ background:#4338ca; }
  .icon-btn{ flex:0 0 auto; border:1px solid var(--line); background:#f8fafc; color:var(--ink-2); border-radius:10px;
    padding:7px 10px; font-size:14px; cursor:pointer; transition:.16s; line-height:1; }
  .icon-btn:hover{ background:var(--brand-soft); border-color:#c7cbff; }
  /* 发音设置 */
  .vrow{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; cursor:pointer; }
  .vrow:hover{ background:#f7f9fc; }
  .vrow.on{ background:var(--brand-soft); }
  .vrow .vn{ flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vrow.on .vn{ color:var(--brand); }
  .vrow .vt{ font-size:11px; color:var(--ink-3); flex:0 0 auto; }
  .vrow .play{ border:0; background:transparent; cursor:pointer; font-size:15px; padding:4px 6px; border-radius:8px; }
  .vrow .play:hover{ background:#eef1f7; }
  .vsec{ font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.5px; padding:14px 10px 6px; }
  .rate-box{ padding:6px 12px 14px; }
  .rate-box .rl{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-2); margin-bottom:6px; }
  .rate-box input{ width:100%; accent-color:var(--brand); }
  .empty-plan{ color:var(--ink-3); font-size:13px; padding:4px 6px; }

  /* ---------- progress ---------- */
  .bar{ background:#fff; border-radius:14px; padding:13px 16px; box-shadow:var(--shadow); margin-bottom:16px; }
  .bar-top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ink-2); margin-bottom:9px; gap:10px; }
  .bar-top b{ color:var(--ink); font-size:15px; }
  .bar-top .l{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track{ height:7px; background:#eef1f7; border-radius:99px; overflow:hidden; }
  .fill{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#6366f1,#4f46e5); transition:width .4s ease; }

  /* ---------- card ---------- */
  .wrap{ perspective:1400px; margin-bottom:16px; }
  .card{
    display:grid; transform-style:preserve-3d; transition:transform .62s cubic-bezier(.35,.1,.2,1);
    cursor:pointer; will-change:transform;
  }
  .card.flip{ transform:rotateY(180deg); }
  .face{
    grid-area:1/1; position:relative; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border-radius:22px; box-shadow:var(--shadow);
    padding:30px 26px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; min-height:330px; border:1px solid rgba(255,255,255,.9);
  }
  .back{ transform:rotateY(180deg); justify-content:center; }
  .star{ position:absolute; top:12px; right:14px; border:0; background:transparent; font-size:19px; cursor:pointer; padding:4px; line-height:1; filter:grayscale(1); opacity:.4; transition:.18s; }
  .star:hover{ opacity:.8; }
  .star.on{ filter:none; opacity:1; }

  .word{ font-size:clamp(34px,8.4vw,54px); font-weight:700; letter-spacing:-.5px; line-height:1.14; word-break:break-word; }
  .phon-row{ display:flex; align-items:center; gap:9px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .ipa{ font-size:16px; color:var(--ink-2); font-family:"Times New Roman",Georgia,serif; letter-spacing:.3px; }
  .spk{
    border:1px solid var(--line); background:#f8fafc; color:var(--ink-2); cursor:pointer;
    border-radius:99px; padding:5px 11px; font-size:11px; font-weight:700; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px; transition:.16s; letter-spacing:.4px;
  }
  .spk:hover{ background:var(--brand-soft); border-color:#c7cbff; color:var(--brand); }
  .spk:active{ transform:scale(.95); }
  .hint{ margin-top:26px; font-size:12.5px; color:var(--ink-3); }
  .hint kbd{ background:#f1f4f9; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; font-family:inherit; font-size:11px; }

  .back .word{ font-size:clamp(24px,5.8vw,34px); }
  .pos-line{ margin-top:14px; font-size:17px; font-weight:600; color:var(--brand); }
  .pos-line .t{ font-style:italic; color:var(--ink-2); font-weight:600; margin-right:8px; font-size:15px; }
  .eg{ margin-top:20px; padding-top:18px; border-top:1px dashed var(--line); width:100%; }
  .eg-en{ font-size:15px; line-height:1.65; color:var(--ink); }
  .eg-zh{ font-size:13px; line-height:1.6; color:var(--ink-3); margin-top:5px; }

  /* ---------- actions ---------- */
  .actions{ display:flex; gap:10px; }
  .btn{
    flex:1; border:0; border-radius:15px; padding:15px 10px; font-size:15.5px; font-weight:700;
    font-family:inherit; cursor:pointer; transition:.16s; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:active{ transform:scale(.975); }
  .btn.again{ background:#fff; color:var(--warn); box-shadow:var(--shadow); border:1px solid #f3e2c8; }
  .btn.again:hover{ background:var(--warn-soft); }
  .btn.got{ background:var(--ok); color:#fff; box-shadow:0 8px 20px rgba(14,164,114,.28); }
  .btn.got:hover{ background:#0b9066; }
  .btn.ghost{ background:#fff; color:var(--ink-2); box-shadow:var(--shadow); flex:0 0 auto; padding:15px 18px; }
  .btn.ghost:hover{ color:var(--brand); }
  .btn.primary{ background:var(--brand); color:#fff; }
  .btn.primary:hover{ background:#4338ca; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* ---------- panels ---------- */
  .panel{ background:#fff; border-radius:22px; box-shadow:var(--shadow); padding:34px 26px; text-align:center; }
  .panel .big{ font-size:44px; line-height:1; margin-bottom:14px; }
  .panel h2{ margin:0 0 8px; font-size:21px; }
  .panel p{ margin:0; color:var(--ink-2); font-size:14px; line-height:1.7; }
  .review-list{ margin:22px 0 4px; display:flex; flex-direction:column; gap:8px; text-align:left; }
  .rv{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; background:#f8fafc; border:1px solid var(--line); }
  .rv.bad{ background:var(--warn-soft); border-color:#f5e3c6; }
  .rv .w{ font-weight:700; font-size:15.5px; }
  .rv .m{ color:var(--ink-2); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv .tag{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:#e6f7f1; color:var(--ok); white-space:nowrap; }
  .rv.bad .tag{ background:#fbe6c8; color:var(--warn); }
  .panel .actions{ margin-top:22px; }

  .spin{ width:26px; height:26px; border:3px solid #e6eaf3; border-top-color:var(--brand); border-radius:50%; margin:0 auto 16px; animation:sp .8s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* ---------- footer ---------- */
  footer{ margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
  .chip{ background:#fff; border-radius:12px; padding:11px 15px; box-shadow:var(--shadow); font-size:12.5px; color:var(--ink-2); flex:1; min-width:104px; }
  .chip b{ display:block; font-size:19px; color:var(--ink); margin-bottom:2px; font-weight:700; }

  /* ---------- drawer ---------- */
  .mask{ position:fixed; inset:0; background:rgba(20,26,40,.42); backdrop-filter:blur(3px); display:none; z-index:40; }
  .mask.on{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(480px,94vw); background:#fff; z-index:41;
    box-shadow:-14px 0 40px rgba(20,26,40,.16); transform:translateX(102%); transition:transform .34s cubic-bezier(.3,.1,.2,1);
    display:flex; flex-direction:column;
  }
  .drawer.on{ transform:none; }
  .dr-head{ padding:18px 20px 14px; border-bottom:1px solid var(--line); }
  .dr-head .t1{ display:flex; justify-content:space-between; align-items:center; font-size:17px; font-weight:700; }
  .dr-head .x{ border:0; background:#f2f5fa; width:30px; height:30px; border-radius:9px; cursor:pointer; font-size:16px; color:var(--ink-2); font-family:inherit; }
  .dr-head input{
    width:100%; margin-top:12px; padding:10px 13px; border-radius:11px; border:1px solid var(--line);
    background:#f8fafc; font-size:14px; font-family:inherit; outline:none; color:var(--ink);
  }
  .dr-head input:focus{ border-color:#c7cbff; background:#fff; }
  .sel-info{ margin-top:10px; font-size:12.5px; color:var(--ink-2); }
  .sel-info b{ color:var(--brand); font-size:14px; }
  .dr-body{ overflow-y:auto; padding:8px 12px 24px; flex:1; }
  .grp{ margin-top:10px; }
  .grp-h{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px 6px; }
  .grp-h .gt{ font-size:12px; font-weight:700; color:var(--ink-3); letter-spacing:.5px; }
  .grp-h .ga{ border:0; background:transparent; color:var(--brand); font-size:11.5px; font-weight:600; font-family:inherit; cursor:pointer; padding:2px 4px; }
  .grp-h .ga:hover{ text-decoration:underline; }
  .bk{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; cursor:pointer; }
  .bk:hover{ background:#f7f9fc; }
  .bk input{ width:17px; height:17px; accent-color:var(--brand); cursor:pointer; flex:0 0 auto; }
  .bk .bn{ flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bk .bc{ font-size:12px; color:var(--ink-3); flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .bk.on .bn{ color:var(--brand); }

  .li{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px; }
  .li:hover{ background:#f7f9fc; }
  .li .dot{ width:7px; height:7px; border-radius:99px; background:#dbe1ec; flex:0 0 auto; }
  .li.learned .dot{ background:var(--ok); }
  .li.wrong .dot{ background:var(--warn); }
  .li .txt{ flex:1; min-width:0; display:block; }
  .li .w{ font-weight:650; font-size:14.5px; display:flex; align-items:center; gap:7px; }
  .li .w span{ font-size:11.5px; font-weight:500; color:var(--ink-3); font-family:"Times New Roman",serif; }
  .li .m{ display:block; font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini{ border:0; background:transparent; cursor:pointer; font-size:14px; color:var(--ink-3); padding:4px 5px; border-radius:7px; font-family:inherit; }
  .mini:hover{ background:#eef1f7; color:var(--brand); }
  .mini.on{ color:var(--ok); }
  .dr-foot{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .dr-foot .btn{ padding:12px; font-size:14px; }

  .toast{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,20px); background:#1c2333; color:#fff;
    padding:10px 18px; border-radius:11px; font-size:13.5px; opacity:0; pointer-events:none; transition:.28s; z-index:60;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:520px){
    .face{ padding:26px 18px; min-height:300px; }
    .brand small{ display:none; }
    .btn{ padding:14px 8px; font-size:14.5px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">📖 每日五词 <small>每天 5 个 · 词书自选</small></div>
    <div class="date" id="dateLine"></div>
  </header>

  <div class="plan-bar">
    <div class="chips" id="chips"></div>
    <button class="icon-btn" id="btnVoice" title="发音设置">🔊</button>
    <button class="add-book" id="btnBooks">＋ 词书</button>
  </div>

  <div class="bar">
    <div class="bar-top">
      <span class="l" id="barLabel">今日进度</span>
      <span><b id="pNow">0</b> / <span id="pAll">5</span></span>
    </div>
    <div class="track"><div class="fill" id="pFill"></div></div>
  </div>

  <main id="main"></main>

  <footer>
    <div class="chip"><b id="sLearned">0</b>累计已学</div>
    <div class="chip"><b id="sMastered">0</b>已掌握</div>
    <div class="chip"><b id="sStreak">0</b>连续天数</div>
    <div class="chip"><b id="sWrong">0</b>错词待复习</div>
  </footer>
</div>

<div class="mask" id="mask"></div>

<!-- 词书选择 -->
<aside class="drawer" id="bookDrawer">
  <div class="dr-head">
    <div class="t1"><span>选择词书</span><button class="x" id="bkClose">✕</button></div>
    <input id="bkSearch" placeholder="搜索词书名称，如 考研 / 雅思 / 初中…" autocomplete="off">
    <div class="sel-info" id="selInfo"></div>
  </div>
  <div class="dr-body" id="bookList"></div>
  <div class="dr-foot">
    <button class="btn ghost" id="bkClear" style="flex:0 0 auto">清空</button>
    <button class="btn primary" id="bkDone" style="flex:1">完成</button>
  </div>
</aside>

<!-- 词表 -->
<aside class="drawer" id="listDrawer">
  <div class="dr-head">
    <div class="t1"><span id="drTitle">词表</span><button class="x" id="drClose">✕</button></div>
    <input id="drSearch" placeholder="搜索单词或中文释义…" autocomplete="off">
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-foot">
    <button class="btn ghost" id="drReset" style="flex:1">重置全部学习进度</button>
  </div>
</aside>

<!-- 发音设置 -->
<aside class="drawer" id="voiceDrawer">
  <div class="dr-head">
    <div class="t1"><span>发音设置</span><button class="x" id="vcClose">✕</button></div>
  </div>
  <div class="dr-body" id="voiceBody"></div>
  <div class="dr-foot">
    <button class="btn ghost" id="vcTest" style="flex:1">🔊 试听当前设置</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="books/meta.js"></script>
<script>
(function(){
  "use strict";

  var PER_DAY = 5;
  var KEY = 'word-daily-v3';
  var META = window.BOOK_META || [];
  var BOOKS = {};        // id -> [{w,p,t,m,e,z}]
  var LOADING = {};
  var POOL = null;       // 合并池（按单词去重）
  var POOL_MAP = null;   // 小写单词 -> 词对象（O(1) 查找，池子可能十几万词）
  var POOL_ORDER = null; // 固定洗牌顺序
  var PLAN_KEY = '';

  var CAT_ORDER = ['精选', '小学', '初中', '高中', '四级', '六级', '考研', '出国考试', '专四专八', '职场商务', '其他'];

  var S = {
    plan: [],            // 勾选的词书 id
    learned:{}, mastered:{}, fav:{}, wrong:{},
    today: null,         // { date, planKey, ids, idx, res }
    streak:{ last:'', days:0 },
    voiceUS: '',         // 用户选定的美音语音名
    voiceUK: '',         // 用户选定的英音语音名
    rate: 0.9            // 语速
  };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var o = JSON.parse(raw); Object.keys(S).forEach(function(kk){ if(o[kk]!==undefined) S[kk]=o[kk]; }); }
    }catch(e){}
    if(!S.plan || !S.plan.length){
      var def = ['tech','hand_daily'].filter(function(id){ return metaOf(id).count; });
      S.plan = def.length ? def : (META[0] ? [META[0].id] : []);
    }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function hash(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
    return h>>>0;
  }
  function rng(seed){
    var a = seed>>>0;
    return function(){
      a = (a + 0x6D2B79F5)|0;
      var t = Math.imul(a ^ (a>>>15), 1|a);
      t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
      return ((t ^ (t>>>14))>>>0) / 4294967296;
    };
  }
  function shuffle(arr, seed){
    var r = rng(hash(seed)), a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function $(id){ return document.getElementById(id); }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  var toastT;
  function toast(msg){
    var el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 1800);
  }
  function metaOf(id){
    for(var i=0;i<META.length;i++) if(META[i].id===id) return META[i];
    return { id:id, name:id, count:0, cat:'其他' };
  }
  /* 合并池里单词唯一，直接用单词小写做进度键 */
  function k(word){ return String(word).toLowerCase(); }

  /* ============ 词书加载 ============ */
  function loadBook(id, cb){
    if(BOOKS[id]) return cb(true);
    if(LOADING[id]){ LOADING[id].push(cb); return; }
    LOADING[id] = [cb];
    var s = document.createElement('script');
    s.src = 'books/' + id + '.js';
    s.onload = function(){
      var raw = (window.BOOKS && window.BOOKS[id]) || [];
      BOOKS[id] = raw.map(function(r){
        return { w:r[0], p:r[1]||'', t:r[2]||'', m:r[3]||'', e:r[4]||'', z:r[5]||'' };
      });
      var q = LOADING[id] || []; delete LOADING[id];
      q.forEach(function(f){ try{ f(true); }catch(e){} });
    };
    s.onerror = function(){
      var q = LOADING[id] || []; delete LOADING[id];
      q.forEach(function(f){ try{ f(false); }catch(e){} });
    };
    document.head.appendChild(s);
  }

  function loadPlan(cb){
    var ids = (S.plan||[]).slice();
    var todo = ids.filter(function(id){ return !BOOKS[id]; });
    if(!todo.length) return cb(true);
    var done = 0, failed = [];
    todo.forEach(function(id){
      loadBook(id, function(ok){
        done++;
        if(!ok) failed.push(id);
        if(done < todo.length){
          renderLoading('正在加载词书 ' + done + ' / ' + todo.length + ' …');
        }else{
          cb(failed.length === 0, failed);
        }
      });
    });
  }

  /* ============ 合并池 ============ */
  function planKeyOf(){ return (S.plan||[]).slice().sort().join(','); }
  function rebuildPool(){
    var pool = [], map = {};
    (S.plan||[]).forEach(function(bid){
      (BOOKS[bid]||[]).forEach(function(o){
        var key = o.w.toLowerCase();
        if(map[key]) return;
        map[key] = o;
        pool.push(o);
      });
    });
    POOL = pool;
    POOL_MAP = map;
    PLAN_KEY = planKeyOf();
    POOL_ORDER = shuffle(pool.map(function(o){ return o.w; }), 'order::' + PLAN_KEY);
  }
  function ensurePool(){ if(!POOL || PLAN_KEY !== planKeyOf()) rebuildPool(); return POOL; }
  function wordObj(w){
    var blank = { w:w, p:'', t:'', m:'', e:'', z:'' };
    if(!POOL_MAP) return blank;
    return POOL_MAP[String(w).toLowerCase()] || blank;
  }

  /* ============ 今日词 ============ */
  function ensureToday(){
    ensurePool();
    var d = todayStr(), t = S.today, pk = planKeyOf();
    if(t && t.date === d && t.planKey === pk && t.ids && t.ids.length) return t;
    var avail = POOL_ORDER.filter(function(w){ return !S.learned[k(w)] && !S.mastered[k(w)]; });
    S.today = { date:d, planKey:pk, ids:avail.slice(0, PER_DAY), idx:0, res:{} };
    save();
    return S.today;
  }
  var RV = { ids:[], idx:0, res:{}, kind:'review' };
  function inReview(){ return RV.ids.length > 0; }
  function cur(){ return inReview() ? RV : ensureToday(); }
  function clearRV(){ RV = { ids:[], idx:0, res:{}, kind:'review' }; }
  function nextBatch(n){
    ensurePool();
    return POOL_ORDER.filter(function(w){ return !S.learned[k(w)] && !S.mastered[k(w)]; }).slice(0, n);
  }

  /* ============ 发音 ============ */
  /* macOS 自带一堆「趣味语音」（Zarvox 外星人、Bubbles 泡泡、Bad News、Bahh…），
     它们的 lang 同样是 en-US —— 取「第一个 en-US」会命中它们，听起来像扬声器坏了。
     策略：白名单优先 → 排除趣味语音 → 兜底。用户也能在发音设置里自己选。 */
  var PREFERRED = {
    'en-us': ['Samantha','Ava','Allison','Susan','Nicky','Tom','Joelle','Zoe','Evan','Nathan','Alex','Eddy','Flo','Sandy','Shelley','Reed'],
    'en-gb': ['Daniel','Kate','Serena','Oliver','Stephanie','Martha','Arthur','Eddy','Flo','Sandy','Shelley','Reed']
  };
  var NOVELTY = ['Albert','Bad News','Bahh','Bells','Boing','Bubbles','Cellos','Wobble','Jester',
    'Organ','Superstar','Trinoids','Whisper','Zarvox','Good News','Grandma','Grandpa','Junior',
    'Ralph','Fred','Kathy','Hysterical','Deranged','Pipe Organ','Princess','Agnes','Bruce','Victoria','Vicki'];
  var voices = [];
  function isNovelty(name){
    for(var i=0;i<NOVELTY.length;i++) if(name.indexOf(NOVELTY[i]) === 0) return true;
    return false;
  }
  function normLang(s){ return (s||'').replace('_','-').toLowerCase(); }
  function refreshVoices(){
    if(window.speechSynthesis) voices = speechSynthesis.getVoices();
    return voices;
  }
  function voicesFor(lang){
    if(!voices.length) refreshVoices();
    var l = normLang(lang);
    var exact = voices.filter(function(v){ return normLang(v.lang) === l; });
    if(exact.length) return exact;
    return voices.filter(function(v){ return normLang(v.lang).indexOf(l.slice(0,2)) === 0; });
  }
  function findByName(lang, name){
    if(!name) return null;
    var list = voicesFor(lang);
    for(var i=0;i<list.length;i++) if(list[i].name === name) return list[i];
    for(var j=0;j<list.length;j++) if(list[j].name.indexOf(name) === 0) return list[j];
    return null;
  }
  function pickVoice(lang){
    var l = normLang(lang);
    var saved = findByName(lang, l === 'en-gb' ? S.voiceUK : S.voiceUS);
    if(saved) return saved;
    var list = voicesFor(lang);
    var prefs = PREFERRED[l] || [];
    for(var i=0;i<prefs.length;i++){
      for(var j=0;j<list.length;j++) if(list[j].name.indexOf(prefs[i]) === 0) return list[j];
    }
    for(var m=0;m<list.length;m++) if(!isNovelty(list[m].name)) return list[m];
    return list[0] || null;
  }
  if(window.speechSynthesis){
    speechSynthesis.onvoiceschanged = function(){ refreshVoices(); if(vcOpen) renderVoiceList(); };
    voices = speechSynthesis.getVoices();
  }
  function speak(text, lang, voiceName){
    lang = lang || 'en-US';
    if(!window.speechSynthesis){ toast('当前浏览器不支持语音朗读'); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = S.rate || 0.9;
    var v = voiceName ? findByName(lang, voiceName) : pickVoice(lang);
    if(v){ u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  }

  /* ============ 渲染：顶部计划条 ============ */
  function renderChips(){
    var plan = S.plan || [];
    if(!plan.length){
      $('chips').innerHTML = '<span class="empty-plan">还没有选择词书，点右边「＋ 词书」开始</span>';
      return;
    }
    $('chips').innerHTML = plan.map(function(id){
      var m = metaOf(id);
      return '<button class="chip-b" data-remove="'+esc(id)+'" title="点击移除">'+esc(m.name)+' <span class="x">✕</span></button>';
    }).join('');
    Array.prototype.forEach.call($('chips').querySelectorAll('[data-remove]'), function(b){
      b.onclick = function(){
        var id = b.dataset.remove;
        S.plan = S.plan.filter(function(x){ return x !== id; });
        if(!S.plan.length){ S.plan = []; }
        S.today = null; POOL = null; clearRV(); save(); render();
        toast('已移除 ' + metaOf(id).name);
      };
    });
  }

  function renderDate(){
    var d = new Date();
    var wk = ['日','一','二','三','四','五','六'][d.getDay()];
    ensurePool();
    var done = POOL.length - POOL_ORDER.filter(function(w){ return !S.learned[k(w)] && !S.mastered[k(w)]; }).length;
    var dayNo = Math.max(1, Math.ceil(done / PER_DAY));
    $('dateLine').innerHTML = (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk+' · 第 <b>'+dayNo+'</b> 天';
  }

  function renderProgress(){
    var c = cur();
    var total = c.ids.length || PER_DAY;
    $('pNow').textContent = Math.min(c.idx, total);
    $('pAll').textContent = total;
    $('pFill').style.width = total ? Math.round(Math.min(c.idx,total)/total*100)+'%' : '0%';
    ensurePool();
    $('barLabel').textContent = inReview()
      ? '复习中'
      : ('今日进度 · 已选 ' + (S.plan||[]).length + ' 本 / 共 ' + fmt(POOL.length) + ' 词');
  }

  function renderStats(){
    var nl = 0, nm = 0, nw = 0;
    Object.keys(S.learned).forEach(function(x){ if(S.learned[x]) nl++; });
    Object.keys(S.mastered).forEach(function(x){ if(S.mastered[x]) nm++; });
    Object.keys(S.wrong).forEach(function(x){ if(S.wrong[x]) nw++; });
    $('sLearned').textContent = nl;
    $('sMastered').textContent = nm;
    $('sStreak').textContent = S.streak.days || 0;
    $('sWrong').textContent = nw;
  }

  /* ============ 渲染：卡片 ============ */
  function cardHTML(o, flipped){
    var star = S.fav[k(o.w)] ? 'on' : '';
    var phon = o.p ? '<span class="ipa">'+esc(o.p)+'</span>' : '';
    var eg = o.e
      ? '<div class="eg"><div class="eg-en">'+esc(o.e)+'</div>'+(o.z?'<div class="eg-zh">'+esc(o.z)+'</div>':'')+'</div>'
      : '';
    var pos = (o.t ? '<span class="t">'+esc(o.t)+'</span>' : '');
    return '' +
    '<div class="wrap"><div class="card'+(flipped?' flip':'')+'" id="card">' +
      '<div class="face front">' +
        '<button class="star '+star+'" title="收藏">⭐</button>' +
        '<div class="word">'+esc(o.w)+'</div>' +
        '<div class="phon-row">' + phon +
          '<button class="spk" data-lang="en-US">🔊 US</button>' +
          '<button class="spk" data-lang="en-GB">🔊 UK</button>' +
        '</div>' +
        '<div class="hint">点击卡片 / 按 <kbd>空格</kbd> 查看释义</div>' +
      '</div>' +
      '<div class="face back">' +
        '<button class="star '+star+'" title="收藏">⭐</button>' +
        '<div class="word">'+esc(o.w)+'</div>' +
        '<div class="phon-row">' + phon +
          '<button class="spk" data-lang="en-US">🔊 US</button>' +
          '<button class="spk" data-lang="en-GB">🔊 UK</button>' +
        '</div>' +
        '<div class="pos-line">'+pos+esc(o.m)+'</div>' +
        eg +
      '</div>' +
    '</div></div>' +
    '<div class="actions">' +
      '<button class="btn again" id="btnAgain">😵 不认识 <span style="opacity:.55;font-size:12px">1</span></button>' +
      '<button class="btn got" id="btnGot">😎 认识 <span style="opacity:.6;font-size:12px">2</span></button>' +
    '</div>';
  }

  function renderDone(){
    var c = cur();
    var ids = c.ids, res = c.res;
    var bad = ids.filter(function(w){ return res[w] === 'no'; });
    var good = ids.length - bad.length;
    var isExtra = inReview() && RV.kind === 'extra';
    var rows = ids.map(function(w){
      var o = wordObj(w);
      var isBad = res[w] === 'no';
      return '<div class="rv'+(isBad?' bad':'')+'">' +
        '<button class="mini" data-say="'+esc(w)+'">🔊</button>' +
        '<span class="w">'+esc(w)+'</span>' +
        '<span class="m">'+esc(o.m)+'</span>' +
        '<span class="tag">'+(isBad?'待复习':'已掌握')+'</span></div>';
    }).join('');
    var title = inReview() ? (isExtra ? '加背完成！' : '复习完成') : '今日完成！';
    var emoji = bad.length ? '💪' : (isExtra ? '🚀' : '🎉');
    var nextTip = inReview()
      ? (isExtra ? '又拿下了 5 个新词，进度已保存。' : '复习轮结束，今天的任务继续。')
      : '今天的 5 个词已经过完，明天会自动换新词。';
    var canExtra = nextBatch(PER_DAY).length > 0;

    $('main').innerHTML =
      '<div class="panel">' +
        '<div class="big">'+emoji+'</div>' +
        '<h2>'+title+'</h2>' +
        '<p>认识 <b style="color:var(--ok)">'+good+'</b> 个，不认识 <b style="color:var(--warn)">'+bad.length+'</b> 个。'+nextTip+'</p>' +
        '<div class="review-list">'+rows+'</div>' +
        '<div class="actions" style="flex-wrap:wrap">' +
          (bad.length ? '<button class="btn again" id="btnRedo">🔁 再练这 '+bad.length+' 个</button>' : '') +
          (canExtra ? '<button class="btn ghost" id="btnExtra" style="flex:1">➕ 再背 5 个</button>' : '') +
          '<button class="btn got" id="btnNext" style="flex:1">📚 看词表</button>' +
        '</div>' +
      '</div>';

    Array.prototype.forEach.call($('main').querySelectorAll('[data-say]'), function(b){
      b.onclick = function(){ speak(b.dataset.say, 'en-US'); };
    });
    var redo = $('btnRedo');
    if(redo) redo.onclick = function(){ RV = { ids: bad.slice(), idx:0, res:{}, kind:'review' }; render(); };
    var extra = $('btnExtra');
    if(extra) extra.onclick = function(){ RV = { ids: nextBatch(PER_DAY), idx:0, res:{}, kind:'extra' }; render(); };
    $('btnNext').onclick = function(){ clearRV(); render(); openList(); };
  }

  function renderNoPlan(){
    $('main').innerHTML =
      '<div class="panel">' +
        '<div class="big">📚</div>' +
        '<h2>先挑几本词书吧</h2>' +
        '<p>这里准备了 <b>'+META.length+'</b> 本词书，共 <b>'+fmt(META.reduce(function(a,b){ return a+b.count; },0))+'</b> 个单词。<br>' +
        '从小学到专八、考研到雅思托福，勾选你想学的就行。</p>' +
        '<div class="actions" style="margin-top:22px">' +
          '<button class="btn primary" id="btnPick">选择词书</button>' +
        '</div>' +
      '</div>';
    $('btnPick').onclick = openBooks;
  }

  function renderAllDone(){
    $('main').innerHTML =
      '<div class="panel">' +
        '<div class="big">🏆</div>' +
        '<h2>选中的词书已全部学完</h2>' +
        '<p>共 '+fmt(POOL.length)+' 个单词。可以再勾选别的词书，或者重置进度重来。</p>' +
        '<div class="actions">' +
          '<button class="btn again" id="btnPick2">＋ 添加词书</button>' +
          '<button class="btn got" id="btnReset2">↺ 重置进度</button>' +
        '</div>' +
      '</div>';
    $('btnPick2').onclick = openBooks;
    $('btnReset2').onclick = function(){ resetAll(); };
  }

  function renderLoading(msg){
    $('main').innerHTML = '<div class="panel"><div class="spin"></div>' +
      '<h2>'+esc(msg || '正在加载词书…')+'</h2>' +
      '<p>首次加载会下载词条数据，之后浏览器会缓存。</p></div>';
  }

  function renderLoadError(failed){
    $('main').innerHTML = '<div class="panel"><div class="big">⚠️</div>' +
      '<h2>词书加载失败</h2><p>' + (failed && failed.length ? '未能加载：'+esc(failed.join('、')) : '请检查 books/ 目录是否完整。') +
      '<br>可以刷新页面重试，或先移除这些词书。</p>' +
      '<div class="actions"><button class="btn primary" id="btnRetry">重试</button></div></div>';
    $('btnRetry').onclick = function(){ render(); };
  }

  function bindCard(o){
    var card = $('card');
    if(!card) return;
    card.onclick = function(e){
      if(e.target.closest('.star') || e.target.closest('.spk')) return;
      card.classList.toggle('flip');
    };
    Array.prototype.forEach.call(card.querySelectorAll('.spk'), function(b){
      b.onclick = function(e){ e.stopPropagation(); speak(o.w, b.dataset.lang); };
    });
    Array.prototype.forEach.call(card.querySelectorAll('.star'), function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var key = k(o.w);
        if(S.fav[key]) delete S.fav[key]; else S.fav[key] = true;
        save();
        Array.prototype.forEach.call(card.querySelectorAll('.star'), function(x){ x.classList.toggle('on', !!S.fav[key]); });
        toast(S.fav[key] ? '已收藏' : '已取消收藏');
      };
    });
  }

  function render(){
    renderChips(); renderStats();

    if(!(S.plan||[]).length){ renderDate(); renderNoPlan(); $('barLabel').textContent='今日进度'; $('pNow').textContent='0'; $('pAll').textContent='5'; $('pFill').style.width='0%'; return; }

    var need = (S.plan||[]).filter(function(id){ return !BOOKS[id]; });
    if(need.length){
      renderLoading('正在加载词书 ' + (S.plan.length - need.length) + ' / ' + S.plan.length + ' …');
      loadPlan(function(ok, failed){
        if(ok) render(); else renderLoadError(failed);
      });
      return;
    }

    renderDate(); renderProgress();

    var c = cur();
    if(!c.ids.length){ renderAllDone(); return; }
    if(c.idx >= c.ids.length){ renderDone(); return; }

    var o = wordObj(c.ids[c.idx]);
    $('main').innerHTML = cardHTML(o, false);
    bindCard(o);
    $('btnAgain').onclick = function(){ mark('no'); };
    $('btnGot').onclick   = function(){ mark('yes'); };
  }

  /* ============ 操作 ============ */
  function mark(kind){
    var c = cur();
    var w = c.ids[c.idx];
    var key = k(w);
    c.res[w] = (kind === 'yes') ? 'yes' : 'no';
    if(kind === 'yes'){
      S.learned[key] = Date.now();
      if(S.wrong[key]) delete S.wrong[key];
    }else{
      S.wrong[key] = true;
      S.learned[key] = Date.now();
    }
    c.idx++;
    save();
    if(!inReview() && c.idx >= c.ids.length) finishDay();
    render();
  }

  function finishDay(){
    var d = todayStr();
    if(S.streak.last === d) return;
    var y = new Date(); y.setDate(y.getDate()-1);
    var ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    S.streak.days = (S.streak.last === ys) ? (S.streak.days||0)+1 : 1;
    S.streak.last = d;
    save();
  }

  function resetAll(){
    S.learned = {}; S.mastered = {}; S.wrong = {}; S.fav = {};
    S.today = null; clearRV();
    save(); render(); renderList(); toast('已重置');
  }

  /* ============ 词书选择抽屉 ============ */
  var bkOpen = false;
  function openBooks(){ bkOpen = true; $('mask').classList.add('on'); $('bookDrawer').classList.add('on'); renderBookList(); }
  function closeBooks(){ bkOpen = false; $('mask').classList.remove('on'); $('bookDrawer').classList.remove('on'); }

  function renderBookList(){
    var q = ($('bkSearch').value || '').trim().toLowerCase();
    var sel = {};
    (S.plan||[]).forEach(function(id){ sel[id] = 1; });

    var groups = {};
    META.forEach(function(m){
      if(q && m.name.toLowerCase().indexOf(q) < 0 && (m.cat||'').toLowerCase().indexOf(q) < 0) return;
      (groups[m.cat] = groups[m.cat] || []).push(m);
    });

    var html = '';
    CAT_ORDER.forEach(function(cat){
      var arr = groups[cat];
      if(!arr || !arr.length) return;
      arr.sort(function(a,b){ return b.count - a.count; });
      var selCount = arr.filter(function(m){ return sel[m.id]; }).length;
      html += '<div class="grp"><div class="grp-h"><span class="gt">'+esc(cat)+' · '+arr.length+' 本</span>' +
        '<button class="ga" data-cat="'+esc(cat)+'">'+(selCount===arr.length?'取消全选':'全选')+'</button></div>';
      arr.forEach(function(m){
        html += '<label class="bk'+(sel[m.id]?' on':'')+'">' +
          '<input type="checkbox" data-book="'+esc(m.id)+'"'+(sel[m.id]?' checked':'')+'>' +
          '<span class="bn">'+esc(m.name)+'</span>' +
          '<span class="bc">'+fmt(m.count)+'</span></label>';
      });
      html += '</div>';
    });
    $('bookList').innerHTML = html || '<p style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">没有匹配的词书</p>';

    var totalWords = META.filter(function(m){ return sel[m.id]; }).reduce(function(a,b){ return a+b.count; }, 0);
    $('selInfo').innerHTML = '已选 <b>'+(S.plan||[]).length+'</b> 本 · 共 <b>'+fmt(totalWords)+'</b> 词' +
      (totalWords > 20000 ? ' <span style="color:var(--warn)">（词量较大，首次加载会慢一些）</span>' : '');

    Array.prototype.forEach.call($('bookList').querySelectorAll('input[data-book]'), function(cb){
      cb.onchange = function(){
        var id = cb.dataset.book;
        if(cb.checked){ if(S.plan.indexOf(id) < 0) S.plan.push(id); }
        else S.plan = S.plan.filter(function(x){ return x !== id; });
        S.today = null; POOL = null; clearRV(); save();
        renderBookList(); render();
      };
    });
    Array.prototype.forEach.call($('bookList').querySelectorAll('[data-cat]'), function(b){
      b.onclick = function(){
        var cat = b.dataset.cat;
        var ids = META.filter(function(m){ return m.cat === cat; }).map(function(m){ return m.id; });
        var allSel = ids.every(function(id){ return S.plan.indexOf(id) >= 0; });
        if(allSel) S.plan = S.plan.filter(function(x){ return ids.indexOf(x) < 0; });
        else ids.forEach(function(id){ if(S.plan.indexOf(id) < 0) S.plan.push(id); });
        S.today = null; POOL = null; clearRV(); save();
        renderBookList(); render();
      };
    });
  }

  /* ============ 词表抽屉 ============ */
  var lsOpen = false;
  function openList(){ lsOpen = true; $('mask').classList.add('on'); $('listDrawer').classList.add('on'); renderList(); }
  function closeList(){ lsOpen = false; $('mask').classList.remove('on'); $('listDrawer').classList.remove('on'); }

  function renderList(){
    $('drTitle').textContent = '词表 · 已选 ' + (S.plan||[]).length + ' 本';
    if(!POOL){ $('drBody').innerHTML = '<p style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">词书加载中…</p>'; return; }
    var q = ($('drSearch').value || '').trim().toLowerCase();
    var list = POOL.filter(function(o){
      if(!q) return true;
      return o.w.toLowerCase().indexOf(q) >= 0 || (o.m||'').indexOf(q) >= 0;
    });
    var CAP = 300;
    var html = list.slice(0, CAP).map(function(o){
      var key = k(o.w);
      var st = S.mastered[key] ? 'learned' : (S.learned[key] ? (S.wrong[key] ? 'wrong' : 'learned') : '');
      var mk = S.mastered[key] ? '✓' : '☆';
      return '<div class="li '+st+'">' +
        '<span class="dot"></span>' +
        '<span class="txt"><span class="w">'+esc(o.w)+(o.p?'<span>'+esc(o.p)+'</span>':'')+'</span>' +
        '<span class="m">'+esc((o.t?o.t+' ':'')+o.m)+'</span></span>' +
        '<button class="mini" data-say="'+esc(o.w)+'">🔊</button>' +
        '<button class="mini '+(S.mastered[key]?'on':'')+'" data-master="'+esc(o.w)+'" title="标记已掌握">'+mk+'</button>' +
      '</div>';
    }).join('');
    if(list.length > CAP) html += '<p style="text-align:center;color:var(--ink-3);font-size:12.5px;padding:14px 0">还有 '+fmt(list.length-CAP)+' 个词，输入关键词可精确查找</p>';
    $('drBody').innerHTML = html || '<p style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">没有匹配的单词</p>';

    Array.prototype.forEach.call($('drBody').querySelectorAll('[data-say]'), function(b){
      b.onclick = function(){ speak(b.dataset.say, 'en-US'); };
    });
    Array.prototype.forEach.call($('drBody').querySelectorAll('[data-master]'), function(b){
      b.onclick = function(){
        var key = k(b.dataset.master);
        if(S.mastered[key]) delete S.mastered[key];
        else { S.mastered[key] = true; S.learned[key] = Date.now(); if(S.wrong[key]) delete S.wrong[key]; }
        save(); renderList(); render();
      };
    });
  }

  /* ============ 发音设置抽屉 ============ */
  var vcOpen = false;
  function openVoice(){
    vcOpen = true; $('mask').classList.add('on'); $('voiceDrawer').classList.add('on');
    refreshVoices(); renderVoiceList();
    setTimeout(function(){ refreshVoices(); if(vcOpen) renderVoiceList(); }, 400);
  }
  function closeVoice(){ vcOpen = false; $('mask').classList.remove('on'); $('voiceDrawer').classList.remove('on'); }

  function renderVoiceList(){
    var body = $('voiceBody');
    var all = refreshVoices();
    if(!all.length){
      body.innerHTML = '<p style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0;line-height:1.8">' +
        '浏览器还没给出语音列表。<br>刷新页面试试，或确认系统已安装英语语音。</p>';
      return;
    }
    var html = '<div class="rate-box"><div class="rl"><span>语速</span><span id="rateVal">' +
      (S.rate||0.9).toFixed(2)+'×</span></div>' +
      '<input type="range" id="rateRange" min="0.5" max="1.3" step="0.05" value="'+(S.rate||0.9)+'"></div>';

    [['en-US','美式发音','voiceUS'],['en-GB','英式发音','voiceUK']].forEach(function(cfg){
      var lang = cfg[0], label = cfg[1], key = cfg[2];
      var list = voicesFor(lang);
      var chosen = pickVoice(lang);
      html += '<div class="vsec">'+label+'（'+lang+'）</div>';
      if(!list.length){
        html += '<p style="padding:6px 12px;color:var(--ink-3);font-size:13px">系统里没有 '+lang+' 语音</p>';
      }
      list.forEach(function(v){
        var on = chosen && v.name === chosen.name;
        html += '<div class="vrow'+(on?' on':'')+'" data-pick="'+esc(key)+'" data-name="'+esc(v.name)+'">' +
          '<span class="vn">'+esc(v.name)+(isNovelty(v.name)?' <span style="color:var(--warn);font-size:11px">趣味音</span>':'')+'</span>' +
          '<button class="play" data-play="'+esc(v.name)+'" data-lang="'+lang+'">🔊</button>' +
          (on ? '<span class="vt">当前</span>' : '') +
        '</div>';
      });
    });
    body.innerHTML = html;

    var rr = $('rateRange');
    if(rr) rr.oninput = function(){
      S.rate = parseFloat(rr.value);
      $('rateVal').textContent = S.rate.toFixed(2)+'×';
      save();
    };
    Array.prototype.forEach.call(body.querySelectorAll('[data-play]'), function(b){
      b.onclick = function(e){
        e.stopPropagation();
        speak('Hello, this is how I sound.', b.dataset.lang, b.dataset.play);
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-pick]'), function(r){
      r.onclick = function(){
        S[r.dataset.pick] = r.dataset.name;
        save(); renderVoiceList();
        speak('Hello, this is how I sound.', r.dataset.pick === 'voiceUK' ? 'en-GB' : 'en-US', r.dataset.name);
        toast('已设为当前语音');
      };
    });
  }

  /* ============ 事件 ============ */
  $('mask').onclick = function(){ closeBooks(); closeList(); closeVoice(); };
  $('btnBooks').onclick = openBooks;
  $('bkClose').onclick = closeBooks;
  $('bkDone').onclick = closeBooks;
  $('bkSearch').oninput = renderBookList;
  $('btnVoice').onclick = openVoice;
  $('vcClose').onclick = closeVoice;
  $('vcTest').onclick = function(){ speak('Hello, this is how I sound.', 'en-US'); };
  $('bkClear').onclick = function(){
    S.plan = []; S.today = null; POOL = null; clearRV(); save();
    renderBookList(); render(); toast('已清空选择');
  };
  $('drClose').onclick = closeList;
  $('drReset').onclick = function(){ if(confirm('确定重置全部学习进度？已学、已掌握、错词、收藏都会清空。')) resetAll(); };
  $('drSearch').oninput = renderList;

  document.addEventListener('keydown', function(e){
    if(bkOpen || lsOpen || vcOpen){
      if(e.key === 'Escape'){ closeBooks(); closeList(); closeVoice(); }
      return;
    }
    if(e.target && e.target.tagName === 'INPUT') return;
    if(!POOL || !(S.plan||[]).length) return;
    var c = cur();
    if(!c.ids.length || c.idx >= c.ids.length) return;
    var o = wordObj(c.ids[c.idx]);
    var kk = (e.key || '').toLowerCase();
    if(e.code === 'Space' || e.key === 'Enter'){
      e.preventDefault();
      var card = $('card'); if(card) card.classList.toggle('flip');
    }else if(e.key === '1' || kk === 'j'){ e.preventDefault(); mark('no'); }
    else if(e.key === '2' || kk === 'k'){ e.preventDefault(); mark('yes'); }
    else if(kk === 'p' && o){ e.preventDefault(); speak(o.w, 'en-US'); }
    else if(kk === 'f' && o){
      e.preventDefault();
      var key = k(o.w);
      if(S.fav[key]) delete S.fav[key]; else S.fav[key] = true;
      save();
      var card2 = $('card');
      if(card2) Array.prototype.forEach.call(card2.querySelectorAll('.star'), function(x){ x.classList.toggle('on', !!S.fav[key]); });
      toast(S.fav[key] ? '已收藏' : '已取消收藏');
    }
  });

  /* ============ 启动 ============ */
  load();
  if(!META.length){
    $('main').innerHTML = '<div class="panel"><h2>词书清单缺失</h2><p>请确认 books/meta.js 是否存在。</p></div>';
  }else{
    render();
  }
  setTimeout(function(){ if(window.speechSynthesis) voices = speechSynthesis.getVoices(); }, 500);
})();
</script>
</body>
</html>

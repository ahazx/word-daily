<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日五词 · 多词书背单词</title>
<style>
  :root{
    --bg:#eef1f7;
    --card:#ffffff;
    --ink:#1c2333;
    --ink-2:#5a6478;
    --ink-3:#98a1b3;
    --line:#e3e8f0;
    --brand:#4f46e5;
    --brand-soft:#eef0ff;
    --ok:#0ea472;
    --ok-soft:#e6f7f1;
    --warn:#d97706;
    --warn-soft:#fdf3e4;
    --shadow:0 10px 30px rgba(28,35,51,.08), 0 2px 8px rgba(28,35,51,.04);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    background-image:radial-gradient(circle at 12% 0%, #e6ebff 0%, transparent 45%),
                     radial-gradient(circle at 92% 6%, #e3f6f4 0%, transparent 40%);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
    padding:22px 16px 60px;
  }
  .app{ max-width:720px; margin:0 auto; }

  /* ---------- header ---------- */
  header{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .brand{ font-size:21px; font-weight:700; letter-spacing:.2px; display:flex; align-items:center; gap:8px; }
  .brand small{ font-size:12px; font-weight:500; color:var(--ink-3); letter-spacing:0; }
  .date{ font-size:13px; color:var(--ink-2); }
  .date b{ color:var(--brand); font-weight:600; }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:6px; background:#fff; padding:6px; border-radius:14px; box-shadow:var(--shadow); margin-bottom:14px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; border:0; background:transparent; cursor:pointer;
    padding:9px 14px; border-radius:10px; font-size:14px; font-weight:600; color:var(--ink-2);
    font-family:inherit; transition:.18s; white-space:nowrap;
  }
  .tab:hover{ background:#f4f6fb; color:var(--ink); }
  .tab.on{ background:var(--brand); color:#fff; box-shadow:0 4px 12px rgba(79,70,229,.28); }
  .tab .n{ font-size:11px; opacity:.6; margin-left:4px; font-weight:500; }
  .tab.on .n{ opacity:.8; }

  /* ---------- progress ---------- */
  .bar{ background:#fff; border-radius:14px; padding:13px 16px; box-shadow:var(--shadow); margin-bottom:16px; }
  .bar-top{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--ink-2); margin-bottom:9px; gap:10px; }
  .bar-top b{ color:var(--ink); font-size:15px; }
  .bar-top .l{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track{ height:7px; background:#eef1f7; border-radius:99px; overflow:hidden; }
  .fill{ height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,#6366f1,#4f46e5); transition:width .4s ease; }

  /* ---------- card ---------- */
  .wrap{ perspective:1400px; margin-bottom:16px; }
  .card{
    display:grid; transform-style:preserve-3d; transition:transform .62s cubic-bezier(.35,.1,.2,1);
    cursor:pointer; will-change:transform;
  }
  .card.flip{ transform:rotateY(180deg); }
  .face{
    grid-area:1/1; position:relative; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border-radius:22px; box-shadow:var(--shadow);
    padding:30px 26px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; min-height:330px; border:1px solid rgba(255,255,255,.9);
  }
  .back{ transform:rotateY(180deg); justify-content:center; }
  .cat{
    position:absolute; top:16px; left:18px; font-size:11px; font-weight:700; letter-spacing:.6px;
    padding:4px 10px; border-radius:99px; background:var(--brand-soft); color:var(--brand);
  }
  .star{ position:absolute; top:12px; right:14px; border:0; background:transparent; font-size:19px; cursor:pointer; padding:4px; line-height:1; filter:grayscale(1); opacity:.4; transition:.18s; }
  .star:hover{ opacity:.8; }
  .star.on{ filter:none; opacity:1; }

  .word{ font-size:clamp(34px,8.4vw,54px); font-weight:700; letter-spacing:-.5px; line-height:1.14; word-break:break-word; }
  .phon-row{ display:flex; align-items:center; gap:9px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .ipa{ font-size:16px; color:var(--ink-2); font-family:"Times New Roman",Georgia,serif; letter-spacing:.3px; }
  .spk{
    border:1px solid var(--line); background:#f8fafc; color:var(--ink-2); cursor:pointer;
    border-radius:99px; padding:5px 11px; font-size:11px; font-weight:700; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px; transition:.16s; letter-spacing:.4px;
  }
  .spk:hover{ background:var(--brand-soft); border-color:#c7cbff; color:var(--brand); }
  .spk:active{ transform:scale(.95); }
  .hint{ margin-top:26px; font-size:12.5px; color:var(--ink-3); }
  .hint kbd{ background:#f1f4f9; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; font-family:inherit; font-size:11px; }

  .back .word{ font-size:clamp(24px,5.8vw,34px); }
  .pos-line{ margin-top:14px; font-size:17px; font-weight:600; color:var(--brand); }
  .pos-line .t{ font-style:italic; color:var(--ink-2); font-weight:600; margin-right:8px; font-size:15px; }
  .eg{ margin-top:20px; padding-top:18px; border-top:1px dashed var(--line); width:100%; }
  .eg-en{ font-size:15px; line-height:1.65; color:var(--ink); }
  .eg-zh{ font-size:13px; line-height:1.6; color:var(--ink-3); margin-top:5px; }

  /* ---------- actions ---------- */
  .actions{ display:flex; gap:10px; }
  .btn{
    flex:1; border:0; border-radius:15px; padding:15px 10px; font-size:15.5px; font-weight:700;
    font-family:inherit; cursor:pointer; transition:.16s; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:active{ transform:scale(.975); }
  .btn.again{ background:#fff; color:var(--warn); box-shadow:var(--shadow); border:1px solid #f3e2c8; }
  .btn.again:hover{ background:var(--warn-soft); }
  .btn.got{ background:var(--ok); color:#fff; box-shadow:0 8px 20px rgba(14,164,114,.28); }
  .btn.got:hover{ background:#0b9066; }
  .btn.ghost{ background:#fff; color:var(--ink-2); box-shadow:var(--shadow); flex:0 0 auto; padding:15px 18px; }
  .btn.ghost:hover{ color:var(--brand); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  /* ---------- done / empty / loading ---------- */
  .panel{ background:#fff; border-radius:22px; box-shadow:var(--shadow); padding:34px 26px; text-align:center; }
  .panel .big{ font-size:44px; line-height:1; margin-bottom:14px; }
  .panel h2{ margin:0 0 8px; font-size:21px; }
  .panel p{ margin:0; color:var(--ink-2); font-size:14px; line-height:1.7; }
  .review-list{ margin:22px 0 4px; display:flex; flex-direction:column; gap:8px; text-align:left; }
  .rv{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; background:#f8fafc; border:1px solid var(--line); }
  .rv.bad{ background:var(--warn-soft); border-color:#f5e3c6; }
  .rv .w{ font-weight:700; font-size:15.5px; }
  .rv .m{ color:var(--ink-2); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv .tag{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:#e6f7f1; color:var(--ok); white-space:nowrap; }
  .rv.bad .tag{ background:#fbe6c8; color:var(--warn); }
  .panel .actions{ margin-top:22px; }

  .spin{ width:26px; height:26px; border:3px solid #e6eaf3; border-top-color:var(--brand); border-radius:50%; margin:0 auto 16px; animation:sp .8s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* ---------- footer ---------- */
  footer{ margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
  .chip{ background:#fff; border-radius:12px; padding:11px 15px; box-shadow:var(--shadow); font-size:12.5px; color:var(--ink-2); flex:1; min-width:104px; }
  .chip b{ display:block; font-size:19px; color:var(--ink); margin-bottom:2px; font-weight:700; }

  /* ---------- list drawer ---------- */
  .mask{ position:fixed; inset:0; background:rgba(20,26,40,.42); backdrop-filter:blur(3px); display:none; z-index:40; }
  .mask.on{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(460px,92vw); background:#fff; z-index:41;
    box-shadow:-14px 0 40px rgba(20,26,40,.16); transform:translateX(102%); transition:transform .34s cubic-bezier(.3,.1,.2,1);
    display:flex; flex-direction:column;
  }
  .drawer.on{ transform:none; }
  .dr-head{ padding:18px 20px 14px; border-bottom:1px solid var(--line); }
  .dr-head .t1{ display:flex; justify-content:space-between; align-items:center; font-size:17px; font-weight:700; }
  .dr-head .x{ border:0; background:#f2f5fa; width:30px; height:30px; border-radius:9px; cursor:pointer; font-size:16px; color:var(--ink-2); font-family:inherit; }
  .dr-head input{
    width:100%; margin-top:12px; padding:10px 13px; border-radius:11px; border:1px solid var(--line);
    background:#f8fafc; font-size:14px; font-family:inherit; outline:none; color:var(--ink);
  }
  .dr-head input:focus{ border-color:#c7cbff; background:#fff; }
  .dr-body{ overflow-y:auto; padding:10px 12px 24px; flex:1; }
  .li{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px; }
  .li:hover{ background:#f7f9fc; }
  .li .dot{ width:7px; height:7px; border-radius:99px; background:#dbe1ec; flex:0 0 auto; }
  .li.learned .dot{ background:var(--ok); }
  .li.wrong .dot{ background:var(--warn); }
  .li .txt{ flex:1; min-width:0; display:block; }
  .li .w{ font-weight:650; font-size:14.5px; display:flex; align-items:center; gap:7px; }
  .li .w span{ font-size:11.5px; font-weight:500; color:var(--ink-3); font-family:"Times New Roman",serif; }
  .li .m{ display:block; font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini{ border:0; background:transparent; cursor:pointer; font-size:14px; color:var(--ink-3); padding:4px 5px; border-radius:7px; font-family:inherit; }
  .mini:hover{ background:#eef1f7; color:var(--brand); }
  .mini.on{ color:var(--ok); }
  .dr-foot{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .dr-foot .btn{ padding:11px; font-size:13.5px; }

  .toast{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,20px); background:#1c2333; color:#fff;
    padding:10px 18px; border-radius:11px; font-size:13.5px; opacity:0; pointer-events:none; transition:.28s; z-index:60;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:520px){
    .face{ padding:26px 18px; min-height:300px; }
    .brand small{ display:none; }
    .btn{ padding:14px 8px; font-size:14.5px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">📖 每日五词 <small>每天 5 个 · 会读会认</small></div>
    <div class="date" id="dateLine"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="bar">
    <div class="bar-top">
      <span class="l" id="barLabel">今日进度</span>
      <span><b id="pNow">0</b> / <span id="pAll">5</span></span>
    </div>
    <div class="track"><div class="fill" id="pFill"></div></div>
  </div>

  <main id="main"></main>

  <footer>
    <div class="chip"><b id="sLearned">0</b>累计已学</div>
    <div class="chip"><b id="sMastered">0</b>已掌握</div>
    <div class="chip"><b id="sStreak">0</b>连续天数</div>
    <div class="chip"><b id="sWrong">0</b>错词待复习</div>
  </footer>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head">
    <div class="t1"><span id="drTitle">词表</span><button class="x" id="drClose">✕</button></div>
    <input id="drSearch" placeholder="搜索单词或中文释义…" autocomplete="off">
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-foot">
    <button class="btn ghost" id="drReset" style="flex:1">重置当前词书进度</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script src="books/meta.js"></script>
<script>
(function(){
  "use strict";

  var PER_DAY = 5;
  var KEY = 'word-daily-v2';
  var META = window.BOOK_META || [];
  var BOOKS = {};     // id -> [{w,p,t,m,e,z}]
  var INDEX = {};     // "id::word" -> 词对象
  var LOADING = {};

  var S = {
    book: (META[0] || {}).id || 'tech',
    learned:{}, mastered:{}, fav:{}, wrong:{}, today:{}, streak:{ last:'', days:0 }
  };

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var o = JSON.parse(raw); Object.keys(S).forEach(function(kk){ if(o[kk]!==undefined) S[kk]=o[kk]; }); }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function hash(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
    return h>>>0;
  }
  function rng(seed){
    var a = seed>>>0;
    return function(){
      a = (a + 0x6D2B79F5)|0;
      var t = Math.imul(a ^ (a>>>15), 1|a);
      t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
      return ((t ^ (t>>>14))>>>0) / 4294967296;
    };
  }
  function shuffle(arr, seed){
    var r = rng(hash(seed)), a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function $(id){ return document.getElementById(id); }
  var toastT;
  function toast(msg){
    var el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 1700);
  }
  function metaOf(id){
    for(var i=0;i<META.length;i++) if(META[i].id===id) return META[i];
    return { id:id, name:id, count:0, desc:'' };
  }
  /* 进度键：同一单词可能出现在多本词书里，必须按词书隔离 */
  function k(word){ return S.book + '::' + word; }

  /* ============ 词书按需加载 ============ */
  function loadBook(id, cb){
    if(BOOKS[id]) return cb(true);
    if(LOADING[id]){ LOADING[id].push(cb); return; }
    LOADING[id] = [cb];
    var s = document.createElement('script');
    s.src = 'books/' + id + '.js';
    s.onload = function(){
      var raw = (window.BOOKS && window.BOOKS[id]) || [];
      var list = raw.map(function(r){
        return { w:r[0], p:r[1]||'', t:r[2]||'', m:r[3]||'', e:r[4]||'', z:r[5]||'', cat:id };
      });
      BOOKS[id] = list;
      list.forEach(function(o){ INDEX[id+'::'+o.w] = o; });
      var q = LOADING[id] || []; delete LOADING[id];
      q.forEach(function(f){ try{ f(true); }catch(e){} });
    };
    s.onerror = function(){
      var q = LOADING[id] || []; delete LOADING[id];
      q.forEach(function(f){ try{ f(false); }catch(e){} });
    };
    document.head.appendChild(s);
  }

  /* ============ 发音 ============ */
  var voices = [];
  function pickVoice(lang){
    if(!voices.length && window.speechSynthesis) voices = speechSynthesis.getVoices();
    var norm = function(s){ return (s||'').replace('_','-').toLowerCase(); };
    var l = lang.toLowerCase();
    return voices.filter(function(v){ return norm(v.lang) === l; })[0]
        || voices.filter(function(v){ return norm(v.lang).indexOf(l.slice(0,2))===0; })[0]
        || null;
  }
  if(window.speechSynthesis){
    speechSynthesis.onvoiceschanged = function(){ voices = speechSynthesis.getVoices(); };
    voices = speechSynthesis.getVoices();
  }
  function speak(text, lang){
    lang = lang || 'en-US';
    if(!window.speechSynthesis){ toast('当前浏览器不支持语音朗读'); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.88;
    var v = pickVoice(lang);
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }

  /* ============ 今日词 ============ */
  function ensureToday(){
    var d = todayStr(), t = S.today[S.book];
    if(t && t.date === d && t.ids && t.ids.length) return t;
    var list = BOOKS[S.book] || [];
    var order = shuffle(list.map(function(o){ return o.w; }), 'order::' + S.book);
    var avail = order.filter(function(w){ return !S.learned[k(w)] && !S.mastered[k(w)]; });
    S.today[S.book] = { date:d, ids:avail.slice(0, PER_DAY), idx:0, res:{} };
    save();
    return S.today[S.book];
  }
  var RV = { ids:[], idx:0, res:{}, kind:'review' };
  function inReview(){ return RV.ids.length > 0; }
  function cur(){ return inReview() ? RV : ensureToday(); }
  function clearRV(){ RV = { ids:[], idx:0, res:{}, kind:'review' }; }
  function nextBatch(n){
    var list = BOOKS[S.book] || [];
    var order = shuffle(list.map(function(o){ return o.w; }), 'order::' + S.book);
    return order.filter(function(w){ return !S.learned[k(w)] && !S.mastered[k(w)]; }).slice(0, n);
  }

  /* ============ 渲染 ============ */
  function renderTabs(){
    $('tabs').innerHTML = META.map(function(m){
      return '<button class="tab'+(S.book===m.id?' on':'')+'" data-book="'+m.id+'">'+
        esc(m.name)+'<span class="n">'+m.count+'</span></button>';
    }).join('');
    Array.prototype.forEach.call($('tabs').children, function(b){
      b.onclick = function(){
        if(S.book === b.dataset.book) return;
        S.book = b.dataset.book; clearRV(); save(); render();
      };
    });
  }

  function renderDate(){
    var d = new Date();
    var wk = ['日','一','二','三','四','五','六'][d.getDay()];
    var list = BOOKS[S.book] || [];
    var order = shuffle(list.map(function(o){ return o.w; }), 'order::' + S.book);
    var avail = order.filter(function(w){ return !S.learned[k(w)] && !S.mastered[k(w)]; });
    var done = list.length - avail.length;
    var dayNo = Math.max(1, Math.ceil(done / PER_DAY));
    $('dateLine').innerHTML = (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk+' · 第 <b>'+dayNo+'</b> 天';
  }

  function renderProgress(){
    var c = cur();
    var total = c.ids.length || PER_DAY;
    $('pNow').textContent = Math.min(c.idx, total);
    $('pAll').textContent = total;
    $('pFill').style.width = total ? Math.round(Math.min(c.idx,total)/total*100)+'%' : '0%';
    var m = metaOf(S.book);
    $('barLabel').textContent = inReview() ? ('复习 · ' + m.name) : ('今日进度 · ' + m.name + '（共 ' + m.count + ' 词）');
  }

  function renderStats(){
    var nl = 0, nm = 0, nw = 0;
    Object.keys(S.learned).forEach(function(x){ if(S.learned[x]) nl++; });
    Object.keys(S.mastered).forEach(function(x){ if(S.mastered[x]) nm++; });
    Object.keys(S.wrong).forEach(function(x){ if(S.wrong[x]) nw++; });
    $('sLearned').textContent = nl;
    $('sMastered').textContent = nm;
    $('sStreak').textContent = S.streak.days || 0;
    $('sWrong').textContent = nw;
  }

  function cardHTML(o, flipped){
    var m = metaOf(o.cat);
    var star = S.fav[k(o.w)] ? 'on' : '';
    var phon = o.p ? '<span class="ipa">'+esc(o.p)+'</span>' : '';
    var eg = o.e
      ? '<div class="eg"><div class="eg-en">'+esc(o.e)+'</div>'+(o.z?'<div class="eg-zh">'+esc(o.z)+'</div>':'')+'</div>'
      : '';
    var pos = (o.t ? '<span class="t">'+esc(o.t)+'</span>' : '');
    return '' +
    '<div class="wrap"><div class="card'+(flipped?' flip':'')+'" id="card">' +
      '<div class="face front">' +
        '<span class="cat">'+esc(m.name)+'</span>' +
        '<button class="star '+star+'" title="收藏">⭐</button>' +
        '<div class="word">'+esc(o.w)+'</div>' +
        '<div class="phon-row">' + phon +
          '<button class="spk" data-lang="en-US">🔊 US</button>' +
          '<button class="spk" data-lang="en-GB">🔊 UK</button>' +
        '</div>' +
        '<div class="hint">点击卡片 / 按 <kbd>空格</kbd> 查看释义</div>' +
      '</div>' +
      '<div class="face back">' +
        '<span class="cat">'+esc(m.name)+'</span>' +
        '<button class="star '+star+'" title="收藏">⭐</button>' +
        '<div class="word">'+esc(o.w)+'</div>' +
        '<div class="phon-row">' + phon +
          '<button class="spk" data-lang="en-US">🔊 US</button>' +
          '<button class="spk" data-lang="en-GB">🔊 UK</button>' +
        '</div>' +
        '<div class="pos-line">'+pos+esc(o.m)+'</div>' +
        eg +
      '</div>' +
    '</div></div>' +
    '<div class="actions">' +
      '<button class="btn again" id="btnAgain">😵 不认识 <span style="opacity:.55;font-size:12px">1</span></button>' +
      '<button class="btn got" id="btnGot">😎 认识 <span style="opacity:.6;font-size:12px">2</span></button>' +
    '</div>';
  }

  function renderDone(){
    var c = cur();
    var ids = c.ids, res = c.res;
    var bad = ids.filter(function(w){ return res[w] === 'no'; });
    var good = ids.length - bad.length;
    var isExtra = inReview() && RV.kind === 'extra';
    var rows = ids.map(function(w){
      var o = INDEX[S.book+'::'+w] || { w:w, m:'' };
      var isBad = res[w] === 'no';
      return '<div class="rv'+(isBad?' bad':'')+'">' +
        '<button class="mini" data-say="'+esc(w)+'">🔊</button>' +
        '<span class="w">'+esc(w)+'</span>' +
        '<span class="m">'+esc(o.m)+'</span>' +
        '<span class="tag">'+(isBad?'待复习':'已掌握')+'</span></div>';
    }).join('');
    var title = inReview() ? (isExtra ? '加背完成！' : '复习完成') : '今日完成！';
    var emoji = bad.length ? '💪' : (isExtra ? '🚀' : '🎉');
    var nextTip = inReview()
      ? (isExtra ? '又拿下了 5 个新词，进度已保存。' : '复习轮结束，今天的任务继续。')
      : '今天的 5 个词已经过完，明天会自动换新词。';
    var canExtra = nextBatch(PER_DAY).length > 0;

    $('main').innerHTML =
      '<div class="panel">' +
        '<div class="big">'+emoji+'</div>' +
        '<h2>'+title+'</h2>' +
        '<p>认识 <b style="color:var(--ok)">'+good+'</b> 个，不认识 <b style="color:var(--warn)">'+bad.length+'</b> 个。'+nextTip+'</p>' +
        '<div class="review-list">'+rows+'</div>' +
        '<div class="actions" style="flex-wrap:wrap">' +
          (bad.length ? '<button class="btn again" id="btnRedo">🔁 再练这 '+bad.length+' 个</button>' : '') +
          (canExtra ? '<button class="btn ghost" id="btnExtra" style="flex:1">➕ 再背 5 个</button>' : '') +
          '<button class="btn got" id="btnNext" style="flex:1">📚 去看词表</button>' +
        '</div>' +
      '</div>';

    Array.prototype.forEach.call($('main').querySelectorAll('[data-say]'), function(b){
      b.onclick = function(){ speak(b.dataset.say, 'en-US'); };
    });
    var redo = $('btnRedo');
    if(redo) redo.onclick = function(){ RV = { ids: bad.slice(), idx:0, res:{}, kind:'review' }; render(); };
    var extra = $('btnExtra');
    if(extra) extra.onclick = function(){ RV = { ids: nextBatch(PER_DAY), idx:0, res:{}, kind:'extra' }; render(); };
    $('btnNext').onclick = function(){ clearRV(); render(); openDrawer(); };
  }

  function renderEmpty(){
    var m = metaOf(S.book);
    $('main').innerHTML =
      '<div class="panel">' +
        '<div class="big">🏆</div>' +
        '<h2>「'+esc(m.name)+'」已全部学完</h2>' +
        '<p>这本词书没有未学的单词了。可以在词表里复习，或重置进度重新开始。</p>' +
        '<div class="actions">' +
          '<button class="btn again" id="btnOpen">📚 打开词表</button>' +
          '<button class="btn got" id="btnReset">↺ 重置进度</button>' +
        '</div>' +
      '</div>';
    $('btnOpen').onclick = openDrawer;
    $('btnReset').onclick = function(){ resetBook(); };
  }

  function renderLoading(){
    var m = metaOf(S.book);
    $('main').innerHTML = '<div class="panel"><div class="spin"></div>' +
      '<h2>正在加载「'+esc(m.name)+'」词书</h2>' +
      '<p>'+m.count+' 个单词，首次加载后浏览器会缓存。</p></div>';
  }

  function renderLoadError(){
    $('main').innerHTML = '<div class="panel"><div class="big">⚠️</div>' +
      '<h2>词书加载失败</h2><p>请检查 books/ 目录是否完整，然后重试。</p>' +
      '<div class="actions"><button class="btn got" id="btnRetry">重新加载</button></div></div>';
    $('btnRetry').onclick = function(){ render(); };
  }

  function bindCard(o){
    var card = $('card');
    if(!card) return;
    card.onclick = function(e){
      if(e.target.closest('.star') || e.target.closest('.spk')) return;
      card.classList.toggle('flip');
    };
    Array.prototype.forEach.call(card.querySelectorAll('.spk'), function(b){
      b.onclick = function(e){ e.stopPropagation(); speak(o.w, b.dataset.lang); };
    });
    Array.prototype.forEach.call(card.querySelectorAll('.star'), function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var key = k(o.w);
        if(S.fav[key]) delete S.fav[key]; else S.fav[key] = true;
        save();
        Array.prototype.forEach.call(card.querySelectorAll('.star'), function(x){ x.classList.toggle('on', !!S.fav[key]); });
        toast(S.fav[key] ? '已收藏' : '已取消收藏');
      };
    });
  }

  function render(){
    renderTabs(); renderStats();

    if(!BOOKS[S.book]){
      renderProgress(); renderDate();
      renderLoading();
      loadBook(S.book, function(ok){
        if(ok) render(); else renderLoadError();
      });
      return;
    }

    renderDate(); renderProgress();

    var c = cur();
    if(!c.ids.length){ renderEmpty(); return; }
    if(c.idx >= c.ids.length){ renderDone(); return; }

    var o = INDEX[S.book+'::'+c.ids[c.idx]];
    if(!o){ c.idx++; return render(); }

    $('main').innerHTML = cardHTML(o, false);
    bindCard(o);
    $('btnAgain').onclick = function(){ mark('no'); };
    $('btnGot').onclick   = function(){ mark('yes'); };
  }

  /* ============ 操作 ============ */
  function mark(kind){
    var c = cur();
    var w = c.ids[c.idx];
    var key = k(w);
    c.res[w] = (kind === 'yes') ? 'yes' : 'no';
    if(kind === 'yes'){
      S.learned[key] = Date.now();
      if(S.wrong[key]) delete S.wrong[key];
    }else{
      S.wrong[key] = true;
      S.learned[key] = Date.now();
    }
    c.idx++;
    save();
    if(!inReview() && c.idx >= c.ids.length) finishDay();
    render();
  }

  function finishDay(){
    var d = todayStr();
    if(S.streak.last === d) return;
    var y = new Date(); y.setDate(y.getDate()-1);
    var ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    S.streak.days = (S.streak.last === ys) ? (S.streak.days||0)+1 : 1;
    S.streak.last = d;
    save();
  }

  function resetBook(){
    var list = BOOKS[S.book] || [];
    list.forEach(function(o){
      var key = k(o.w);
      delete S.learned[key]; delete S.mastered[key]; delete S.wrong[key]; delete S.fav[key];
    });
    delete S.today[S.book];
    clearRV();
    save(); render(); renderDrawer(); toast('已重置');
  }

  /* ============ 词表抽屉 ============ */
  var drOpen = false;
  function openDrawer(){ drOpen = true; $('mask').classList.add('on'); $('drawer').classList.add('on'); renderDrawer(); }
  function closeDrawer(){ drOpen = false; $('mask').classList.remove('on'); $('drawer').classList.remove('on'); }

  function renderDrawer(){
    var m = metaOf(S.book);
    $('drTitle').textContent = m.name + ' 词表';
    if(!BOOKS[S.book]){ $('drBody').innerHTML = '<p style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">词书加载中…</p>'; return; }
    var q = ($('drSearch').value || '').trim().toLowerCase();
    var list = BOOKS[S.book].filter(function(o){
      if(!q) return true;
      return o.w.toLowerCase().indexOf(q) >= 0 || (o.m||'').indexOf(q) >= 0;
    });
    var CAP = 300;
    var shown = list.slice(0, CAP);
    var html = shown.map(function(o){
      var key = k(o.w);
      var st = S.mastered[key] ? 'learned' : (S.learned[key] ? (S.wrong[key] ? 'wrong' : 'learned') : '');
      var mk = S.mastered[key] ? '✓' : '☆';
      return '<div class="li '+st+'">' +
        '<span class="dot"></span>' +
        '<span class="txt"><span class="w">'+esc(o.w)+(o.p?'<span>'+esc(o.p)+'</span>':'')+'</span>' +
        '<span class="m">'+esc((o.t?o.t+' ':'')+o.m)+'</span></span>' +
        '<button class="mini" data-say="'+esc(o.w)+'">🔊</button>' +
        '<button class="mini '+(S.mastered[key]?'on':'')+'" data-master="'+esc(o.w)+'" title="标记已掌握">'+mk+'</button>' +
      '</div>';
    }).join('');
    if(list.length > CAP) html += '<p style="text-align:center;color:var(--ink-3);font-size:12.5px;padding:14px 0">还有 '+(list.length-CAP)+' 个词，输入关键词可精确查找</p>';
    $('drBody').innerHTML = html || '<p style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">没有匹配的单词</p>';

    Array.prototype.forEach.call($('drBody').querySelectorAll('[data-say]'), function(b){
      b.onclick = function(){ speak(b.dataset.say, 'en-US'); };
    });
    Array.prototype.forEach.call($('drBody').querySelectorAll('[data-master]'), function(b){
      b.onclick = function(){
        var key = k(b.dataset.master);
        if(S.mastered[key]) delete S.mastered[key];
        else { S.mastered[key] = true; S.learned[key] = Date.now(); if(S.wrong[key]) delete S.wrong[key]; }
        save(); renderDrawer(); render();
      };
    });
  }

  /* ============ 事件 ============ */
  $('mask').onclick = closeDrawer;
  $('drClose').onclick = closeDrawer;
  $('drReset').onclick = function(){ if(confirm('确定重置「'+metaOf(S.book).name+'」词书的学习进度？')) resetBook(); };
  $('drSearch').oninput = renderDrawer;

  document.addEventListener('keydown', function(e){
    if(drOpen){ if(e.key === 'Escape') closeDrawer(); return; }
    if(e.target && e.target.tagName === 'INPUT') return;
    if(!BOOKS[S.book]) return;
    var c = cur();
    if(!c.ids.length || c.idx >= c.ids.length) return;
    var o = INDEX[S.book+'::'+c.ids[c.idx]];
    var kk = (e.key || '').toLowerCase();
    if(e.code === 'Space' || e.key === 'Enter'){
      e.preventDefault();
      var card = $('card'); if(card) card.classList.toggle('flip');
    }else if(e.key === '1' || kk === 'j'){ e.preventDefault(); mark('no'); }
    else if(e.key === '2' || kk === 'k'){ e.preventDefault(); mark('yes'); }
    else if(kk === 'p' && o){ e.preventDefault(); speak(o.w, 'en-US'); }
    else if(kk === 'f' && o){
      e.preventDefault();
      var key = k(o.w);
      if(S.fav[key]) delete S.fav[key]; else S.fav[key] = true;
      save();
      var card2 = $('card');
      if(card2) Array.prototype.forEach.call(card2.querySelectorAll('.star'), function(x){ x.classList.toggle('on', !!S.fav[key]); });
      toast(S.fav[key] ? '已收藏' : '已取消收藏');
    }
  });

  /* ============ 启动 ============ */
  load();
  if(!META.length){
    $('main').innerHTML = '<div class="panel"><h2>词书清单缺失</h2><p>请确认 books/meta.js 是否存在。</p></div>';
  }else{
    render();
  }
  setTimeout(function(){ if(window.speechSynthesis) voices = speechSynthesis.getVoices(); }, 500);
})();
</script>
</body>
</html>
